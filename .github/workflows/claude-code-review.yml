on:
  pull_request:
    types: [opened, ready_for_review]
    paths:
      - "src/**"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Hol dir den Diff mit `gh pr diff`. Melde nur Bugs, die durch diesen PR
            neu entstehen, und Verstöße gegen CLAUDE.md. Keine Stilfragen, nichts,
            was Linter oder Typechecker ohnehin finden.
            Findest du nichts Belastbares, poste eine Zusammenfassung der änderungen via 'gh pr comment'
            Wenn du was findest genau ein Kommentar via `gh pr comment` mit Datei- und Zeilenlink.
          claude_args: |
            --model sonnet
            --max-turns 10
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob"
