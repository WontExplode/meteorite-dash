[project]
name = "meteorite-dash"
version = "0.1.0"
description = "A small PyGame-CE based game about dodging incoming meteorites, shooting debris and attacking enemies."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "interrogate>=1.7.0",
    "pygame-ce>=2.5.7",
]

[project.scripts]
meteorite-dash = "meteorite_dash.main:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
meteorite_dash = [
    "assets/images/*.png",
    "assets/images/ships/*.png",
    "assets/sounds/*.mp3",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
